# Ablation: CIFAR-100 CCT-7/3x1 train-only with weight-decay filter + AMP, but the
# ORIGINAL basic augmentation (crop+flip, original mean/std, no RandAugment /
# Mixup / CutMix / Erasing) -- i.e. the augmentation that existed before any
# CCT-recipe change. Everything else matches the full "todo" CIFAR-100 recipe
# (filter, AMP, 310-epoch schedule, lr=6e-4 / warmup_lr=1e-6).
defaults:
  - config
  - override dataset_config: cifar100_basic_aug
  - override early_stopping: no_early_stopping
  - override general: default
  - override growing: none
  - override hydra: custom_paths
  - override line_search: default
  - override loss: cross_entropy_label_smoothing_0_1
  - override lr_scheduler: cct_cosine_warmup_300
  - override metric: multiclass_accuracy
  - override mlflow: iceberg
  - override model: growing_cct_7_3x1_32_mlp512
  - override optimizer: adamw_cct
  - override schedule: cct7_train_only_310epochs
  - _self_

mlflow:
  experiment_name: "growing_cct_cifar100"
  run_name: "cct7_3x1_mlp512_train_only_filter_basicaug"

general:
  batch_size: 128
  num_workers: 8
  seed: 0
  amp: true  # Mixed precision, matching the CCT `amp: true` recipe.
  filter_bias_and_norm: true  # No weight decay on bias/LayerNorm (timm filter_bias_and_bn).

# CIFAR-100 CCT recipe uses a different LR / warmup than CIFAR-10
# (cct_7-3x1_cifar100_300epochs.yml: lr=6e-4, warmup_lr=1e-6).
optimizer:
  lr: 0.0006

lr_scheduler:
  scheduler_object:
    warmup_start_lr: 0.000001
