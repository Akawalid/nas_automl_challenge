# CIFAR-100 dataset configuration -- TORCHVISION augmentation (ablation).
# @package _global_
#
# Ablation variant reproducing the "previous" augmentation pipeline (before the
# switch to timm's exact transforms): torchvision RandomResizedCrop(bicubic) +
# torchvision RandAugment(num_ops=2, magnitude=9) + Mixup/CutMix + torchvision
# RandomErasing. Used to compare against the timm-exact "todo" recipe.

defaults:
  - base
  - _self_


name: cifar100
num_classes: 100

# Mixup / CutMix kept as in the CIFAR-100 recipe (always on, mixup_off_epoch=0).
mixup_alpha: 0.8
cutmix_alpha: 1.0
mixup_prob: 1.0
mixup_switch_prob: 0.5
mixup_off_epoch: 0

dataset:
  _target_: torchvision.datasets.CIFAR100
  root: ${dataset_config.path}
  download: true

sources:
  train:
    extra_args:
      train: true
  test:
    extra_args:
      train: false

transforms:
  standard:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5071, 0.4867, 0.4408]
        std: [0.2675, 0.2565, 0.2761]
  # Previous (torchvision) approximation of the timm pipeline.
  augmented:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.RandomResizedCrop
        size: 32
        scale: [0.8, 1.0]
        ratio: [0.75, 1.3333333333333333]
        interpolation: 3  # InterpolationMode.BICUBIC
      - _target_: torchvision.transforms.RandomHorizontalFlip
      - _target_: torchvision.transforms.RandAugment
        num_ops: 2
        magnitude: 9
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5071, 0.4867, 0.4408]
        std: [0.2675, 0.2565, 0.2761]
      - _target_: torchvision.transforms.RandomErasing
        p: 0.25
        value: random
