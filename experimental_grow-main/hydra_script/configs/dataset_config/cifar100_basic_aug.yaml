# CIFAR-100 dataset configuration -- BASIC augmentation (ablation).
# @package _global_
#
# Ablation variant using the ORIGINAL CIFAR-100 augmentation that existed before
# any CCT-recipe change: RandomCrop(pad=4) + HorizontalFlip, with the original
# mean/std, and NO RandAugment / Mixup / CutMix / Random Erasing. Used to measure
# the effect of `general.filter_bias_and_norm` (+ AMP) without added augmentation.

defaults:
  - base
  - _self_


name: cifar100
num_classes: 100
# No mixup_alpha / cutmix_alpha keys: batch-level Mixup/CutMix stay disabled.

dataset:
  _target_: torchvision.datasets.CIFAR100
  root: ${dataset_config.path}
  download: true

sources:
  train:
    extra_args:
      train: true
  test:
    extra_args:
      train: false

transforms:
  standard:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5071, 0.4865, 0.4409]
        std: [0.2673, 0.2564, 0.2762]
  augmented:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.RandomCrop
        size: 32
        padding: 4
        padding_mode: reflect
      - _target_: torchvision.transforms.RandomHorizontalFlip
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5071, 0.4865, 0.4409]
        std: [0.2673, 0.2564, 0.2762]
