# CIFAR-10 dataset configuration -- BASIC augmentation (ablation).
# @package _global_
#
# Ablation variant: keeps the standard CIFAR-10 dataset but uses the ORIGINAL
# (pre-CCT-recipe) augmentation only -- RandomCrop(pad=4) + HorizontalFlip --
# with NO RandAugment, NO Mixup/CutMix and NO Random Erasing. Used to measure the
# effect of `general.filter_bias_and_norm` (+ AMP) without the added augmentation.

defaults:
  - base
  - _self_


name: cifar10
num_classes: 10
# No mixup_alpha / cutmix_alpha keys: batch-level Mixup/CutMix stay disabled.

dataset:
  _target_: torchvision.datasets.CIFAR10
  root: ${dataset_config.path}
  download: true

sources:
  train:
    extra_args:
      train: true
  test:
    extra_args:
      train: false

transforms:
  standard:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.2470, 0.2435, 0.2616]
  augmented:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.RandomCrop
        size: 32
        padding: 4
        padding_mode: reflect
      - _target_: torchvision.transforms.RandomHorizontalFlip
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.2470, 0.2435, 0.2616]
