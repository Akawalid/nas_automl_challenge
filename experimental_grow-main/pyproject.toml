[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimental_grow"
version = "0.1.0"
description = "Experimental growing neural networks project"
requires-python = ">=3.10"
dependencies = [
    "gromo",
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "python-dotenv>=1",
    "hydra-core>=1.3.2",
    "mlflow>=3",
    "hydra-submitit-launcher>=1.2.0",
    "pyvis>=0.3.2",
    "psutil>=7.2.2",  # hidden dependency of mlflow
    "wandb>=0.18",
]

[tool.uv.sources]
gromo = { path = "../gromo", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["experiments", "tools"]

[tool.isort]
profile = "black"
line_length = 90

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pyright",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "pre-commit>=4.5.1",
]
eeg = [
    "mne>=1.11.0",
    "pyriemann>=0.10",
    "imbalanced-learn>=0.14.1",
]
